name: RPM Build

on:
  push:
    branches:
      - main
    paths:
      - "v4l2loopback.sh"
      - "v4l2loopback.spec"
      - "CHANGELOG.md"
      - "scripts/prepare-release.sh"
      - ".github/workflows/rpm-build.yml"
      - ".github/workflows/release.yml"

  pull_request:
    branches:
      - main
    paths:
      - "v4l2loopback.sh"
      - "v4l2loopback.spec"
      - "CHANGELOG.md"
      - "scripts/prepare-release.sh"
      - ".github/workflows/rpm-build.yml"
      - ".github/workflows/release.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpm-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rpm-build:
    name: Build and validate RPM
    runs-on: ubuntu-latest

    container:
      image: fedora:latest

    steps:
      - name: Install build dependencies
        run: |
          set -Eeuo pipefail

          dnf install -y \
              git \
              rpm-build \
              rpmdevtools \
              tar \
              gzip \
              findutils \
              coreutils

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trust GitHub workspace
        run: |
          set -Eeuo pipefail

          git config --global \
              --add safe.directory \
              "${GITHUB_WORKSPACE}"

      - name: Validate SPEC
        run: |
          set -Eeuo pipefail

          rpmspec -P v4l2loopback.spec >/dev/null
          rpmspec -q v4l2loopback.spec

      - name: Determine package version
        run: |
          set -Eeuo pipefail

          VERSION="$(
              awk '
                  $1 == "Version:" {
                      print $2
                      exit
                  }
              ' v4l2loopback.spec
          )"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid SPEC version: $VERSION"
              exit 1
          fi

          echo "Building version: $VERSION"

          {
              echo "VERSION=$VERSION"
          } >> "$GITHUB_ENV"

      - name: Create RPM build tree
        run: |
          set -Eeuo pipefail

          RPM_TOPDIR="${GITHUB_WORKSPACE}/rpmbuild"

          mkdir -p \
              "${RPM_TOPDIR}/BUILD" \
              "${RPM_TOPDIR}/BUILDROOT" \
              "${RPM_TOPDIR}/RPMS" \
              "${RPM_TOPDIR}/SOURCES" \
              "${RPM_TOPDIR}/SPECS" \
              "${RPM_TOPDIR}/SRPMS"

          echo "RPM_TOPDIR=$RPM_TOPDIR" >> "$GITHUB_ENV"

      - name: Create Source0 archive
        run: |
          set -Eeuo pipefail

          git archive \
              --format=tar.gz \
              --prefix="v4l2loopback-${VERSION}/" \
              --output="${RPM_TOPDIR}/SOURCES/v${VERSION}.tar.gz" \
              HEAD

          echo "Created:"
          ls -lh "${RPM_TOPDIR}/SOURCES/v${VERSION}.tar.gz"

          echo
          echo "Archive contents:"
          tar -tzf \
              "${RPM_TOPDIR}/SOURCES/v${VERSION}.tar.gz" |
              sed -n '1,30p'

      - name: Copy SPEC
        run: |
          set -Eeuo pipefail

          cp \
              v4l2loopback.spec \
              "${RPM_TOPDIR}/SPECS/v4l2loopback.spec"

      - name: Build source and binary RPM
        run: |
          set -Eeuo pipefail

          rpmbuild \
              --define "_topdir ${RPM_TOPDIR}" \
              -ba \
              "${RPM_TOPDIR}/SPECS/v4l2loopback.spec"

      - name: Locate build artifacts
        run: |
          set -Eeuo pipefail

          echo "Source RPM:"
          find "${RPM_TOPDIR}/SRPMS" \
              -type f \
              -name '*.src.rpm' \
              -print

          echo
          echo "Binary RPM:"
          find "${RPM_TOPDIR}/RPMS" \
              -type f \
              -name '*.rpm' \
              -print

      - name: Rebuild from SRPM
        run: |
          set -Eeuo pipefail

          SRPM="$(
              find "${RPM_TOPDIR}/SRPMS" \
                  -type f \
                  -name '*.src.rpm' \
                  -print \
                  -quit
          )"

          if [[ -z "$SRPM" ]]; then
              echo "::error::Source RPM not found"
              exit 1
          fi

          echo "Rebuilding:"
          echo "$SRPM"

          rpmbuild \
              --define "_topdir ${RPM_TOPDIR}/rebuild" \
              --rebuild \
              "$SRPM"

      - name: Inspect binary RPM
        run: |
          set -Eeuo pipefail

          RPM_FILE="$(
              find "${RPM_TOPDIR}/RPMS" \
                  -type f \
                  -name '*.rpm' \
                  ! -name '*.src.rpm' \
                  -print \
                  -quit
          )"

          if [[ -z "$RPM_FILE" ]]; then
              echo "::error::Binary RPM not found"
              exit 1
          fi

          echo "RPM:"
          echo "$RPM_FILE"

          echo
          echo "Package metadata:"
          rpm -qip "$RPM_FILE"

          echo
          echo "Package files:"
          rpm -qlp "$RPM_FILE"

          echo
          echo "Dependencies:"
          rpm -qpR "$RPM_FILE"

      - name: Verify installed manager path
        run: |
          set -Eeuo pipefail

          RPM_FILE="$(
              find "${RPM_TOPDIR}/RPMS" \
                  -type f \
                  -name '*.rpm' \
                  ! -name '*.src.rpm' \
                  -print \
                  -quit
          )"

          if ! rpm -qlp "$RPM_FILE" |
              grep -Fxq '/usr/bin/v4l2loopback'
          then
              echo "::error::RPM does not contain /usr/bin/v4l2loopback"
              exit 1
          fi

          echo "Verified:"
          echo "/usr/bin/v4l2loopback"

      - name: Verify documentation
        run: |
          set -Eeuo pipefail

          RPM_FILE="$(
              find "${RPM_TOPDIR}/RPMS" \
                  -type f \
                  -name '*.rpm' \
                  ! -name '*.src.rpm' \
                  -print \
                  -quit
          )"

          FILES="$(
              rpm -qlp "$RPM_FILE"
          )"

          for doc in \
              README.md \
              FAQ.md \
              TEST.md \
              LICENSE
          do
              if ! grep -Fq "/${doc}" <<< "$FILES"; then
                  echo "::error::Expected RPM documentation missing: $doc"
                  exit 1
              fi
          done

          echo "RPM documentation verified."

      - name: Collect artifacts
        run: |
          set -Eeuo pipefail

          mkdir -p artifacts

          find "${RPM_TOPDIR}/SRPMS" \
              -type f \
              -name '*.src.rpm' \
              -exec cp -v {} artifacts/ \;

          find "${RPM_TOPDIR}/RPMS" \
              -type f \
              -name '*.rpm' \
              -exec cp -v {} artifacts/ \;

          echo
          echo "Collected artifacts:"
          ls -lh artifacts

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: v4l2loopback-manager-${{ env.VERSION }}-rpm
          path: artifacts/
          if-no-files-found: error