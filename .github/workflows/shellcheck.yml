name: ShellCheck

on:
  push:
    branches:
      - main
    paths:
      - "v4l2loopback.sh"
      - ".github/workflows/shellcheck.yml"

  pull_request:
    branches:
      - main
    paths:
      - "v4l2loopback.sh"
      - ".github/workflows/shellcheck.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shellcheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Bash syntax and ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Check Bash syntax
        run: |
          bash -n v4l2loopback.sh

      - name: Run ShellCheck
        run: |
          shellcheck v4l2loopback.sh