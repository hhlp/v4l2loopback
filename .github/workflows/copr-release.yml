name: COPR Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (for example: v1.0.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: copr-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  copr:
    name: Build Fedora COPR
    runs-on: ubuntu-latest

    container:
      image: fedora:latest

    steps:
      - name: Install COPR client
        shell: bash
        run: |
          set -Eeuo pipefail

          dnf install -y \
              copr-cli \
              git

      - name: Determine release tag
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -Eeuo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              TAG="$MANUAL_TAG"
          else
              TAG="$GITHUB_REF_NAME"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid release tag: $TAG"
              exit 1
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"

          printf 'Release tag: %s\n' "$TAG"

      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Configure Git safe directory
        shell: bash
        run: |
          set -Eeuo pipefail

          git config --global \
              --add safe.directory \
              "$GITHUB_WORKSPACE"

      - name: Validate tag against spec
        shell: bash
        run: |
          set -Eeuo pipefail

          VERSION="${TAG#v}"

          SPEC_VERSION="$(
              awk '
                  $1 == "Version:" {
                      print $2
                      exit
                  }
              ' v4l2loopback.spec
          )"

          if [[ -z "$SPEC_VERSION" ]]; then
              echo "::error::Unable to read Version from v4l2loopback.spec"
              exit 1
          fi

          if [[ "$VERSION" != "$SPEC_VERSION" ]]; then
              echo "::error::Tag version ($VERSION) does not match spec version ($SPEC_VERSION)"
              exit 1
          fi

          printf 'Tag version : %s\n' "$VERSION"
          printf 'SPEC version: %s\n' "$SPEC_VERSION"

      - name: Verify tag points to checked out commit
        shell: bash
        run: |
          set -Eeuo pipefail

          TAG_COMMIT="$(
              git rev-list \
                  -n 1 \
                  "$TAG"
          )"

          HEAD_COMMIT="$(
              git rev-parse HEAD
          )"

          if [[ "$TAG_COMMIT" != "$HEAD_COMMIT" ]]; then
              echo "::error::Tag $TAG does not point to checked out commit"
              exit 1
          fi

          printf 'Tag commit : %s\n' "$TAG_COMMIT"
          printf 'HEAD commit: %s\n' "$HEAD_COMMIT"

      - name: Configure COPR authentication
        shell: bash
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          set -Eeuo pipefail

          if [[ -z "$COPR_CONFIG" ]]; then
              echo "::error::COPR_CONFIG secret is not configured"
              exit 1
          fi

          mkdir -p "$HOME/.config"

          printf '%s\n' "$COPR_CONFIG" \
              > "$HOME/.config/copr"

          chmod 600 "$HOME/.config/copr"

      - name: Verify COPR authentication
        shell: bash
        run: |
          set -Eeuo pipefail

          copr-cli whoami

      - name: Trigger COPR release build
        shell: bash
        run: |
          set -Eeuo pipefail

          copr-cli buildscm \
              hhlp/v4l2loopback \
              --clone-url https://github.com/hhlp/v4l2loopback.git \
              --commit "$TAG" \
              --spec v4l2loopback.spec \
              --method rpkg