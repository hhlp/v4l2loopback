name: GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -Eeuo pipefail

          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid release tag: $TAG"
              exit 1
          fi

          VERSION="${TAG#v}"

          SPEC_VERSION="$(
              awk '
                  $1 == "Version:" {
                      print $2
                      exit
                  }
              ' v4l2loopback.spec
          )"

          if [[ "$VERSION" != "$SPEC_VERSION" ]]; then
              echo "::error::Tag version ($VERSION) does not match SPEC version ($SPEC_VERSION)"
              exit 1
          fi

          if ! grep -Fq "## [$VERSION] - " CHANGELOG.md; then
              echo "::error::CHANGELOG.md does not contain release $VERSION"
              exit 1
          fi

          {
              echo "tag=$TAG"
              echo "version=$VERSION"
          } >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          set -Eeuo pipefail

          awk \
              -v version="$version" '
              $0 ~ "^## \\[" version "\\] - " {
                  found = 1
                  next
              }

              found && /^---$/ {
                  exit
              }

              found && /^## \[[^]]+\]/ {
                  exit
              }

              found {
                  print
              }

              END {
                  if (!found) {
                      exit 2
                  }
              }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
              echo "::error::Generated release notes are empty"
              exit 1
          fi

          echo "Release notes:"
          cat release-notes.md

      - name: Verify tag exists remotely
        shell: bash
        run: |
          set -Eeuo pipefail

          git ls-remote \
              --exit-code \
              --tags origin \
              "refs/tags/${tag}" >/dev/null

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if gh release view "$tag" >/dev/null 2>&1; then
              echo "GitHub Release $tag already exists."
              exit 0
          fi

          gh release create "$tag" \
              --verify-tag \
              --title "$tag" \
              --notes-file release-notes.md \
              --latest
